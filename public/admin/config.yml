# Sveltia CMS (Decap-compatible). Login method for the GitHub backend:
# verify the current options in the Sveltia docs before handing over to the client.
backend:
  name: github
  repo: Steff91/bistromat-site
  branch: main

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: settings
    label: Podešavanja
    files:
      - name: info
        label: Kontakt i radno vreme
        file: src/data/info.json
        fields:
          - { name: name, label: Naziv, widget: string }
          - { name: tagline, label: Slogan, widget: string }
          - { name: about, label: Opis restorana (O nama), widget: text }
          - { name: aboutShort, label: Kratak opis (hero, Google opis), widget: text }
          - { name: address, label: Adresa, widget: string }
          - { name: city, label: Grad, widget: string }
          - { name: postalCode, label: Poštanski broj, widget: string }
          - name: geo
            label: GPS koordinate (za Google)
            widget: object
            fields:
              - { name: lat, label: Geografska širina, widget: number, value_type: float }
              - { name: lng, label: Geografska dužina, widget: number, value_type: float }
          - { name: landmark, label: Lokacija (kraj, orijentir), widget: string }
          - { name: mapsLink, label: Link ka Google mapama, widget: string }
          - { name: phone, label: Telefon (prikaz), widget: string }
          - { name: phoneHref, label: Telefon (link, +381...), widget: string }
          - { name: email, label: Email, widget: string }
          - name: hours
            label: Radno vreme
            widget: list
            fields:
              - { name: day, label: Dani, widget: string }
              - { name: time, label: Vreme, widget: string }
          - name: openingHours
            label: Radno vreme za Google (dani na engleskom, vreme HH:MM)
            widget: list
            fields:
              - { name: days, label: Dani (npr. Monday), widget: list }
              - { name: opens, label: Otvara, widget: string }
              - { name: closes, label: Zatvara, widget: string }
          - { name: priceRange, label: Cenovni rang ($–$$$$), widget: string }
          - { name: notice, label: Obaveštenje (praznici, zatvoreno…), widget: string, required: false }
          - name: directions
            label: Kako do nas
            widget: list
            fields:
              - { name: title, label: Naslov, widget: string }
              - { name: text, label: Tekst, widget: text }
          - { name: instagram, label: Instagram URL, widget: string }
          - { name: instagramFeed, label: Instagram feed (Behold JSON URL), widget: string, required: false, hint: "Prazno = sekcija sa Instagram objavama se ne prikazuje" }
          - { name: facebook, label: Facebook URL, widget: string }
          - { name: googleProfile, label: Google profil URL, widget: string }
          - { name: googleReviewLink, label: Link za ostavljanje recenzije, widget: string, required: false }
          - { name: googleRating, label: Google ocena, widget: string }
          - { name: googleReviewCount, label: Broj Google recenzija, widget: string }
          - { name: mapsEmbed, label: Google Maps embed URL, widget: string, required: false }
          - { name: reservationEmbed, label: Embed kod za rezervacije, widget: text, required: false }
          - { name: eventlinName, label: Eventlin naziv (name), widget: string, required: false }
          - { name: eventlinMerchantId, label: Eventlin merchant ID (prazno = bez online rezervacija), widget: string, required: false }
          - { name: formAction, label: Adresa za slanje forme (/send.php), widget: string, required: false }
          - { name: recaptchaSiteKey, label: Google reCAPTCHA v3 site key, widget: string, required: false, hint: "Prazno = bez captcha provere" }

      - name: reservations
        label: Rezervacije
        file: src/data/reservations.json
        fields:
          - { name: intro, label: Uvod, widget: text }
          - { name: maxGuests, label: Najviše osoba online, widget: number, value_type: int, min: 1 }
          - { name: timeSlots, label: Termini (npr. 19:30), widget: list }
          - name: notes
            label: Dobro je da znate
            widget: list
            fields:
              - { name: title, label: Naslov, widget: string }
              - { name: text, label: Tekst, widget: text }

      - name: menu
        label: Meni
        file: src/data/menu.json
        fields:
          - { name: season, label: Sezona, widget: string }
          - { name: updated, label: Ažurirano, widget: string }
          - { name: intro, label: Uvod, widget: text }
          - name: cards
            label: Karte (PDF)
            widget: list
            fields:
              - { name: label, label: Naziv taba, widget: string }
              - { name: pdf, label: PDF, widget: file, media_folder: /public/uploads, public_folder: /uploads }
          - name: highlights
            label: Preporuka šefa
            widget: list
            fields:
              - { name: name, label: Jelo, widget: string }
              - { name: description, label: Opis, widget: string }
              - { name: price, label: Cena, widget: string }
          - { name: allergens, label: Napomena o alergenima, widget: text }

      - name: menuItems
        label: Meni — jela (tekst na stranici Meni)
        file: src/data/menu-items.json
        fields:
          - { name: currency, label: Valuta, widget: hidden, default: RSD }
          - name: sections
            label: Kategorije
            widget: list
            summary: "{{fields.sr}}"
            fields:
              - { name: sr, label: Naziv (srpski), widget: string }
              - { name: en, label: Naziv (engleski), widget: string }
              - name: items
                label: Jela
                widget: list
                summary: "{{fields.sr.name}} · {{fields.price}}"
                fields:
                  - name: sr
                    label: Srpski
                    widget: object
                    fields:
                      - { name: name, label: Naziv, widget: string }
                      - { name: desc, label: Opis, widget: string, required: false }
                  - name: en
                    label: Engleski
                    widget: object
                    fields:
                      - { name: name, label: Naziv, widget: string }
                      - { name: desc, label: Opis, widget: string, required: false }
                  - { name: price, label: Cena (npr. 2.480), widget: string }
                  - { name: unit, label: Jedinica (npr. kg), widget: string, required: false }

      - name: chefTable
        label: Chef's Table
        file: src/data/chef-table.json
        fields:
          - { name: intro, label: Uvod, widget: text }
          - name: facts
            label: Ključne informacije
            widget: list
            fields:
              - { name: label, label: Oznaka, widget: string }
              - { name: value, label: Vrednost, widget: string }
          - name: dates
            label: Termini
            widget: list
            summary: "{{fields.date}} · {{fields.theme}}"
            fields:
              - { name: date, label: Datum, widget: datetime, time_format: false, format: YYYY-MM-DD, date_format: DD.MM.YYYY }
              - { name: time, label: Vreme (npr. 19:00), widget: string }
              - { name: theme, label: Tema, widget: string }
              - { name: guest, label: Gost (šef ili vinarija), widget: string, required: false }
              - { name: price, label: Cena, widget: string }
              - { name: seatsLeft, label: Slobodna mesta (0 = popunjeno), widget: number, value_type: int, min: 0 }
          - name: timeline
            label: Kako izgleda veče
            widget: list
            fields:
              - { name: time, label: Vreme, widget: string }
              - { name: title, label: Naslov, widget: string }
              - { name: text, label: Tekst, widget: string }
          - name: chef
            label: Šef
            widget: object
            fields:
              - { name: name, label: Ime, widget: string }
              - { name: role, label: Uloga, widget: string }
              - { name: bio, label: Biografija, widget: text }
              - { name: quote, label: Citat, widget: text }
              - { name: image, label: Fotografija, widget: image, required: false }
          - name: sampleMenu
            label: Primer menija
            widget: object
            fields:
              - { name: title, label: Naslov, widget: string }
              - name: courses
                label: Sledovi
                widget: list
                fields:
                  - { name: course, label: Sled, widget: string }
                  - { name: dish, label: Jelo, widget: string }
                  - { name: wine, label: Vino, widget: string }
          - name: past
            label: Prethodne večeri
            widget: list
            fields:
              - { name: title, label: Naziv, widget: string }
              - { name: caption, label: Opis (gost, datum), widget: string }
              - { name: image, label: Fotografija, widget: image, required: false }
          - name: faq
            label: Česta pitanja
            widget: list
            fields:
              - { name: q, label: Pitanje, widget: string }
              - { name: a, label: Odgovor, widget: text }

      - name: reviews
        label: Recenzije
        file: src/content/reviews.json
        fields:
          - name: items
            label: Recenzije
            widget: list
            root: true
            fields:
              - { name: id, label: ID (bez razmaka), widget: string }
              - { name: name, label: Ime gosta, widget: string }
              - { name: text, label: Tekst, widget: text }
              - { name: rating, label: Ocena, widget: number, value_type: int, min: 1, max: 5, default: 5 }

  - name: events
    label: Događaji
    folder: src/content/events
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title]
    summary: "{{date}} · {{title}}"
    fields:
      - { name: title, label: Naziv, widget: string }
      - name: type
        label: Vrsta
        widget: select
        options:
          - { label: Vinyl & Dine, value: vinyl }
          - { label: "Chef's Table", value: chef-table }
          - { label: Vinska večer, value: wine }
          - { label: Koktel večer, value: cocktail }
          - { label: Gostujući šef, value: guest-chef }
          - { label: Ostalo, value: other }
      - { name: date, label: Datum, widget: datetime, time_format: false, format: YYYY-MM-DD, date_format: DD.MM.YYYY }
      - { name: time, label: Početak (npr. 20:00), widget: string }
      - { name: endTime, label: Kraj (opciono), widget: string, required: false }
      - { name: excerpt, label: Kratak opis, widget: text }
      - { name: image, label: Fotografija, widget: image, required: false }
      - { name: price, label: Cena, widget: string, required: false }
      - { name: seatsLeft, label: Slobodna mesta (prazno = ne prikazuj, 0 = popunjeno), widget: number, value_type: int, required: false }
      - name: booking
        label: Rezervacija
        widget: select
        default: form
        options:
          - { label: Forma na stranici, value: form }
          - { label: Telefonom, value: phone }
          - { label: Bez rezervacije, value: none }
      - name: program
        label: Program
        widget: list
        required: false
        fields:
          - { name: time, label: Vreme, widget: string }
          - { name: title, label: Stavka, widget: string }
      - name: menu
        label: Meni večeri
        widget: list
        required: false
        fields:
          - { name: course, label: Sled, widget: string }
          - { name: dish, label: Jelo, widget: string }
          - { name: wine, label: Vino, widget: string, required: false }
      - name: guest
        label: Gost
        widget: object
        required: false
        fields:
          - { name: name, label: Ime, widget: string }
          - { name: role, label: Uloga (DJ, šef, vinarija…), widget: string }
          - { name: bio, label: Biografija, widget: text }
          - { name: image, label: Fotografija, widget: image, required: false }
          - { name: link, label: Link, widget: string, required: false }
      - name: gallery
        label: Fotografije sa večeri (posle događaja)
        widget: list
        required: false
        fields:
          - { name: src, label: Fotografija, widget: image, required: false }
          - { name: alt, label: Opis, widget: string }
      - { name: body, label: Opis večeri, widget: markdown, required: false }

  - name: services
    label: Usluge
    folder: src/content/services
    create: true
    slug: "{{slug}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Naziv, widget: string }
      - { name: order, label: Redosled, widget: number, value_type: int }
      - { name: excerpt, label: Kratak opis (kartica i mega meni), widget: string }
      - { name: heroTitle, label: Naslov, widget: string }
      - { name: heroTitleEm, label: Naslov – drugi red (kurziv), widget: string, required: false }
      - { name: intro, label: Uvod, widget: text }
      - { name: image, label: Glavna fotografija, widget: image, required: false }
      - name: facts
        label: Ključne informacije
        widget: list
        required: false
        fields:
          - { name: label, label: Oznaka (npr. Kapacitet), widget: string }
          - { name: value, label: Vrednost, widget: string }
      - { name: occasions, label: Prilike, widget: list, required: false }
      - { name: includedTitle, label: Naslov sekcije „Šta je uključeno“, widget: string, required: false }
      - name: included
        label: Šta je uključeno
        widget: list
        required: false
        fields:
          - { name: title, label: Naslov, widget: string }
          - { name: text, label: Tekst, widget: text }
      - name: gallery
        label: Galerija
        widget: list
        required: false
        fields:
          - { name: src, label: Fotografija, widget: image, required: false }
          - { name: alt, label: Opis fotografije, widget: string }
      - { name: packagesTitle, label: Naslov sekcije paketa, widget: string, required: false }
      - name: packages
        label: Paketi
        widget: list
        required: false
        fields:
          - { name: label, label: Oznaka, widget: string }
          - { name: name, label: Naziv, widget: string }
          - { name: features, label: Stavke, widget: list }
          - { name: price, label: Cena, widget: string }
          - { name: featured, label: Istaknut, widget: boolean, default: false }
      - name: steps
        label: Kako funkcioniše (prazno = podrazumevani koraci)
        widget: list
        required: false
        fields:
          - { name: title, label: Korak, widget: string }
          - { name: text, label: Tekst, widget: text }
      - name: faq
        label: Česta pitanja
        widget: list
        required: false
        fields:
          - { name: q, label: Pitanje, widget: string }
          - { name: a, label: Odgovor, widget: text }
      - name: form
        label: Forma za upit
        widget: select
        default: event
        options:
          - { label: Događaj, value: event }
          - { label: Ketering, value: catering }
          - { label: Radionica, value: workshop }
          - { label: Vaučer, value: voucher }
          - { label: Bez forme, value: none }
      - { name: body, label: Dodatni tekst, widget: markdown, required: false }

  - name: legal
    label: Pravne stranice
    folder: src/content/legal
    create: false
    delete: false
    fields:
      - { name: title, label: Naslov, widget: string }
      - { name: description, label: Opis (za pretraživače), widget: string }
      - { name: updated, label: Poslednja izmena, widget: string }
      - { name: body, label: Tekst, widget: markdown }

  # ---------------------------------------------------------------------------
  # ENGLISH VERSION (/en/)
  # English entries hold only the translated text. Everything else (dates, prices,
  # seats, photos, order, links) comes from the Serbian entry. Lists are matched
  # by position, so keep them in the same order as in Serbian.
  # ---------------------------------------------------------------------------

  - name: settings_en
    label: "EN · Podešavanja"
    files:
      - name: info_en
        label: "EN · Kontakt i radno vreme"
        file: src/data/en/info.json
        fields:
          - { name: about, label: Opis restorana (About us), widget: text }
          - { name: aboutShort, label: Kratak opis (hero, Google), widget: text }
          - { name: city, label: Grad, widget: string }
          - { name: landmark, label: Lokacija (kraj, orijentir), widget: string }
          - name: hours
            label: Radno vreme (isti redosled kao srpski)
            widget: list
            fields:
              - { name: day, label: Dani, widget: string }
              - { name: time, label: Vreme, widget: string }
          - { name: notice, label: Obaveštenje, widget: string, required: false }
          - name: directions
            label: Kako do nas (isti redosled kao srpski)
            widget: list
            fields:
              - { name: title, label: Naslov, widget: string }
              - { name: text, label: Tekst, widget: text }

      - name: reservations_en
        label: "EN · Rezervacije"
        file: src/data/en/reservations.json
        fields:
          - { name: intro, label: Uvod, widget: text }
          - name: notes
            label: Good to know (isti redosled kao srpski)
            widget: list
            fields:
              - { name: title, label: Naslov, widget: string }
              - { name: text, label: Tekst, widget: text }

      - name: menu_en
        label: "EN · Meni"
        file: src/data/en/menu.json
        fields:
          - { name: season, label: Sezona, widget: string }
          - { name: updated, label: Ažurirano, widget: string }
          - { name: intro, label: Uvod, widget: text }
          - name: cards
            label: Nazivi tabova (isti redosled kao srpski)
            widget: list
            fields:
              - { name: label, label: Naziv taba, widget: string }
          - name: highlights
            label: Chef's picks (isti redosled kao srpski; cena dolazi iz srpskog)
            widget: list
            fields:
              - { name: name, label: Jelo, widget: string }
              - { name: description, label: Opis, widget: string }
          - { name: allergens, label: Napomena o alergenima, widget: text }

      - name: chefTable_en
        label: "EN · Chef's Table"
        file: src/data/en/chef-table.json
        fields:
          - { name: intro, label: Uvod, widget: text }
          - name: facts
            label: Ključne informacije (isti redosled)
            widget: list
            fields:
              - { name: label, label: Oznaka, widget: string }
              - { name: value, label: Vrednost, widget: string }
          - name: dates
            label: Termini (isti redosled; datum, vreme i mesta dolaze iz srpskog)
            widget: list
            fields:
              - { name: theme, label: Tema, widget: string }
              - { name: guest, label: Gost, widget: string, required: false }
              - { name: price, label: Cena, widget: string }
          - name: timeline
            label: Kako izgleda veče (isti redosled)
            widget: list
            fields:
              - { name: title, label: Naslov, widget: string }
              - { name: text, label: Tekst, widget: string }
          - name: chef
            label: Šef
            widget: object
            fields:
              - { name: role, label: Uloga, widget: string }
              - { name: bio, label: Biografija, widget: text }
              - { name: quote, label: Citat, widget: text }
          - name: sampleMenu
            label: Primer menija
            widget: object
            fields:
              - { name: title, label: Naslov, widget: string }
              - name: courses
                label: Sledovi (isti redosled)
                widget: list
                fields:
                  - { name: dish, label: Jelo, widget: string }
                  - { name: wine, label: Vino, widget: string }
          - name: past
            label: Prethodne večeri (isti redosled)
            widget: list
            fields:
              - { name: title, label: Naziv, widget: string, required: false }
              - { name: caption, label: Opis, widget: string }
          - name: faq
            label: FAQ
            widget: list
            fields:
              - { name: q, label: Pitanje, widget: string }
              - { name: a, label: Odgovor, widget: text }

  - name: events_en
    label: "EN · Događaji"
    label_singular: "EN događaj"
    folder: src/content/en/events
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ← {{ref}}"
    fields:
      - { name: ref, label: Srpski original, widget: relation, collection: events, value_field: "{{slug}}", search_fields: [title], display_fields: [title] }
      - { name: title, label: Naziv (engleski; od njega nastaje URL), widget: string }
      - { name: excerpt, label: Kratak opis, widget: text }
      - { name: price, label: Cena, widget: string, required: false }
      - name: program
        label: Program (isti redosled; vreme dolazi iz srpskog)
        widget: list
        required: false
        fields:
          - { name: title, label: Stavka, widget: string }
      - name: menu
        label: Meni večeri (isti redosled)
        widget: list
        required: false
        fields:
          - { name: dish, label: Jelo, widget: string }
          - { name: wine, label: Vino, widget: string, required: false }
      - name: guest
        label: Gost
        widget: object
        required: false
        fields:
          - { name: role, label: Uloga, widget: string }
          - { name: bio, label: Biografija, widget: text }
      - name: gallery
        label: Opisi fotografija (isti redosled)
        widget: list
        required: false
        fields:
          - { name: alt, label: Opis, widget: string }
      - { name: body, label: Opis večeri, widget: markdown, required: false }

  - name: services_en
    label: "EN · Usluge"
    label_singular: "EN usluga"
    folder: src/content/en/services
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ← {{ref}}"
    fields:
      - { name: ref, label: Srpski original, widget: relation, collection: services, value_field: "{{slug}}", search_fields: [title], display_fields: [title] }
      - { name: title, label: Naziv (engleski; od njega nastaje URL), widget: string }
      - { name: excerpt, label: Kratak opis, widget: string }
      - { name: heroTitle, label: Naslov, widget: string }
      - { name: heroTitleEm, label: Naslov – drugi red (kurziv), widget: string, required: false }
      - { name: intro, label: Uvod, widget: text }
      - name: facts
        label: Ključne informacije (isti redosled)
        widget: list
        required: false
        fields:
          - { name: label, label: Oznaka, widget: string }
          - { name: value, label: Vrednost, widget: string }
      - { name: occasions, label: Prilike, widget: list, required: false }
      - { name: includedTitle, label: Naslov sekcije „What's included“, widget: string, required: false }
      - name: included
        label: Šta je uključeno (isti redosled)
        widget: list
        required: false
        fields:
          - { name: title, label: Naslov, widget: string }
          - { name: text, label: Tekst, widget: text }
      - name: gallery
        label: Opisi fotografija (isti redosled)
        widget: list
        required: false
        fields:
          - { name: alt, label: Opis, widget: string }
      - { name: packagesTitle, label: Naslov sekcije paketa, widget: string, required: false }
      - name: packages
        label: Paketi (isti redosled)
        widget: list
        required: false
        fields:
          - { name: label, label: Oznaka, widget: string }
          - { name: name, label: Naziv, widget: string }
          - { name: features, label: Stavke, widget: list }
          - { name: price, label: Cena, widget: string }
      - name: steps
        label: Kako funkcioniše (isti redosled)
        widget: list
        required: false
        fields:
          - { name: title, label: Korak, widget: string }
          - { name: text, label: Tekst, widget: text }
      - name: faq
        label: FAQ
        widget: list
        required: false
        fields:
          - { name: q, label: Pitanje, widget: string }
          - { name: a, label: Odgovor, widget: text }
      - { name: body, label: Dodatni tekst, widget: markdown, required: false }

  - name: legal_en
    label: "EN · Pravne stranice"
    folder: src/content/en/legal
    create: false
    delete: false
    fields:
      - { name: ref, label: Srpski original, widget: hidden }
      - { name: title, label: Naslov, widget: string }
      - { name: description, label: Opis (za pretraživače), widget: string }
      - { name: updated, label: Poslednja izmena, widget: string }
      - { name: body, label: Tekst, widget: markdown }
